schema: spec-driven

context: |
  Product: Dispensart — medication dispensing, lot-level inventory and inter-warehouse transfers for
  FARTMAR IPS (senior full-stack technical test). Source of truth for scope: project/Prueba_Tecnica_Senior_FARTMAR_Candidato.md
  (business rules RN-01..RN-11, parts A-E). Time budget: 6-8 effective hours, 72 h delivery window.
  Warehouses: Farmacia Central, Farmacia Urgencias, Bodega Hospitalizacion. Roles: auxiliar_farmacia,
  regente_farmacia, medico, auditor (read-only, masked patient data), admin.
  Stack: software/api = Laravel 13 on PHP 8.5 (REST, Sanctum, Policies/Gates, Form Requests, API Resources,
  services outside controllers). software/web = React + TypeScript + Vite SPA. PostgreSQL 16 (CHECK
  constraints, row locks). Docker multi-stage images (PHP-FPM + Nginx, non-root). GitHub Actions CI/CD.
  Quality: Pint, Larastan, ESLint. AI assistant: Laravel service behind a provider interface, read-only
  function-calling tools, mock provider by default, no patient data sent to the model.
  Host ports (author's machine has 80/5173/5432/8000/8080 taken): WEB_PORT=8090 (Nginx: SPA + /api proxy),
  DB_PORT=5434; API never exposed to the host. Working branch dev; main is user-only.
  Repo layout: .claude/ + CLAUDE.md = harness at root, openspec/ = SDD working files, docs/adr/ = ADRs,
  software/ = all application source code, .github/ = CI at repo root.
  Public repository: no secrets committed, synthetic data only.
  Language: code identifiers English; comments, commits, documentation and OpenSpec artifact prose in
  Spanish; UI strings Spanish (centralized strings module). OpenSpec structural keywords stay English
  (## ADDED Requirements, #### Scenario:, WHEN/THEN, SHALL). Capability ids kebab-case English.
  Conventional commits in Spanish. Zero-cost policy: free tiers only.
  Patient data is sensitive health data — Colombian Ley 1581/2012 governs handling.

rules:
  proposal:
    - Keep proposals under 1 page
    - Always include Assumptions section when ambiguities were resolved without asking
    - Cite the business rules (RN-xx) and test parts (A-E) the change covers
  specs:
    - Every requirement ships at least 1 negative scenario
    - Write operations enumerate every outcome (happy + each rejection with observable behavior/HTTP code)
    - Stock-touching requirements include concurrency and idempotency scenarios
    - Patient-data requirements include role, masking and access-log scenarios
    - UI requirements include loading/error/empty states, double-submit prevention and a reachable entry point
  tasks:
    - Tasks atomic (max 1h), each cites the scenarios it satisfies
    - "Order: database, domain, application, infrastructure, api, then web UI, then devops"
    - Every new or changed endpoint mandates one real-HTTP feature test task
