# CI/CD de Dispensart.
# Calidad (backend, frontend, contrato OpenAPI) en todo push y pull request, sin secretos ni publicación.
# Entrega (S8) solo en push a dev o main, tras la calidad del mismo commit:
#   build (GHCR, etiqueta = SHA) -> staging simulado (humo por digest) -> production (solo main, aprobación manual).
name: CI

# package.json y package-lock.json de la raíz fijan Redocly, que usa el trabajo backend.
on:
  push:
    paths:
      - "software/**"
      - ".github/workflows/ci.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "software/**"
      - ".github/workflows/ci.yml"
      - "package.json"
      - "package-lock.json"

# Nada a nivel de workflow: cada trabajo declara su mínimo (design D7).
permissions: {}

# En main nunca se corta una entrega en curso; en el resto, el push nuevo reemplaza al anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (Pint, Larastan, Pest sobre PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: software/api
    services:
      # Misma imagen que compose. Base dispensart_test, como la que fuerza phpunit.xml (design D3).
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_DB: dispensart_test
          POSTGRES_USER: dispensart
          # Credencial efímera del contenedor de CI, no es un secreto.
          POSTGRES_PASSWORD: dispensart_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dispensart -d dispensart_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: dispensart_test
      DB_USERNAME: dispensart
      DB_PASSWORD: dispensart_ci_only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, intl, bcmath
          coverage: none
          tools: composer:v2

      - name: Ruta de la caché de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('software/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Dependencias (desde composer.lock)
        run: composer install --no-interaction --no-progress --prefer-dist

      # Sin .env, Pest marca como advertencia la lectura fallida del archivo en cada prueba de Feature.
      # La plantilla no trae secretos y el entorno del trabajo (DB_*) prevalece sobre ella.
      - name: Entorno desde la plantilla
        run: cp .env.example .env

      - name: Formato (Pint, solo verificación)
        run: vendor/bin/pint --test

      - name: Análisis estático (Larastan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Pruebas (Pest contra PostgreSQL)
        run: vendor/bin/pest

      # Evaluación del asistente (S7) con el proveedor simulado: sin red, sin llaves, resultado estable.
      # Crea y borra su propia base dispensart_test_assistant_eval. Sale con 0 solo si todas aciertan.
      # LOG_LEVEL=warning: oculta las líneas info `assistant.query` (una por pregunta) que se mezclan con la
      # tabla por stderr; avisos y errores siguen visibles.
      - name: Evaluación del asistente (assistant:eval, modo simulado)
        env:
          AI_PROVIDER: mock
          LOG_LEVEL: warning
        run: php artisan assistant:eval

      # Deriva del contrato (design D9): re-exporta openapi.json desde el código (Scramble) y falla si
      # difiere del archivo versionado. Corre en el runner porque usa git diff sobre el checkout.
      - name: Contrato OpenAPI sin deriva
        run: composer openapi:check

      # Redocly fijado en el package-lock.json de la raíz (herramientas de desarrollo).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: software/web/.nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Herramientas de la raíz (desde package-lock.json)
        working-directory: .
        run: npm ci --no-audit --no-fund

      - name: Lint del contrato OpenAPI (Redocly)
        working-directory: .
        run: npm run openapi:lint

  frontend:
    name: Frontend (ESLint, tipos, Vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: software/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: software/web/.nvmrc
          cache: npm
          cache-dependency-path: software/web/package-lock.json

      # npm ci falla si package.json y el lockfile no coinciden.
      - name: Dependencias (desde package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tipos (tsc)
        run: npm run typecheck

      # Tipos de la API derivados del contrato: falla si openapi.json cambió sin regenerar api-schema.ts.
      - name: Tipos de la API sin deriva (openapi-typescript)
        run: npm run api:types:check

      - name: Pruebas (Vitest)
        run: npm test -- --run

  # ---------------------------------------------------------------------------------------------------
  # Entrega (S8). Nunca en pull_request ni en otras ramas: el if de build corta toda la cadena.
  # ---------------------------------------------------------------------------------------------------

  # Imágenes api (etapa prod) y web en GHCR, etiqueta única = SHA completo; sin etiquetas móviles (D3).
  # Único trabajo con packages: write. Los digests pasan como salidas a staging y production (D2).
  build:
    name: Imágenes en GHCR (etiqueta = SHA)
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      # Digest ya publicado para este SHA o, si no existía, el recién construido.
      api_digest: ${{ steps.existing.outputs.api_digest || steps.api.outputs.digest }}
      web_digest: ${{ steps.existing.outputs.web_digest || steps.web.outputs.digest }}
      owner_lc: ${{ steps.owner.outputs.owner_lc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GHCR exige el nombre del dueño en minúsculas.
      - name: Dueño del registro en minúsculas
        id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner_lc=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Idempotencia por SHA: si la etiqueta ya existe (re-ejecución del trabajo), se reutiliza su digest y no
      # se construye ni se publica de nuevo; así la etiqueta nunca pasa a apuntar a otra imagen.
      # Ausente = "not found" o acceso denegado (paquete aún inexistente; si de verdad faltara permiso, el push
      # fallaría igual). Cualquier otro error (red, registro) corta el trabajo: no se publica a ciegas.
      - name: Imágenes ya publicadas para este SHA
        id: existing
        env:
          REGISTRY_PREFIX: ghcr.io/${{ steps.owner.outputs.owner_lc }}
          SHA: ${{ github.sha }}
        run: |
          errlog="$(mktemp)"
          for image in api web; do
            ref="$REGISTRY_PREFIX/dispensart-$image:$SHA"
            if manifest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>"$errlog")"; then
              digest="$(jq -r '.digest' <<<"$manifest")"
              if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "::error::Digest ilegible para $ref: $digest"
                exit 1
              fi
              echo "REUTILIZA $image: $ref ya publicada con $digest; se omite construcción y push."
              echo "${image}_digest=$digest" >> "$GITHUB_OUTPUT"
            elif grep -qiE 'not found|manifest unknown|name unknown|denied|403 Forbidden' "$errlog"; then
              echo "CONSTRUYE $image: $ref no existe en el registro."
            else
              cat "$errlog"
              echo "::error::No se pudo consultar $ref en el registro: no se publica sin verificar."
              exit 1
            fi
          done

      # provenance/sbom apagados: un solo manifiesto por imagen (firma y SBOM fuera de alcance, design).
      - name: Imagen api (etapa prod)
        id: api
        if: steps.existing.outputs.api_digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: software
          file: software/docker/api/Dockerfile
          target: prod
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ steps.owner.outputs.owner_lc }}/dispensart-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Imagen web
        id: web
        if: steps.existing.outputs.web_digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: software
          file: software/docker/web/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ steps.owner.outputs.owner_lc }}/dispensart-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Digests publicados
        env:
          API_DIGEST: ${{ steps.existing.outputs.api_digest || steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.existing.outputs.web_digest || steps.web.outputs.digest }}
          API_SOURCE: ${{ steps.existing.outputs.api_digest && 'reutilizada' || 'construida' }}
          WEB_SOURCE: ${{ steps.existing.outputs.web_digest && 'reutilizada' || 'construida' }}
        run: |
          echo "api ($API_SOURCE): $API_DIGEST"
          echo "web ($WEB_SOURCE): $WEB_DIGEST"

  # Staging simulado en el runner con el mismo compose.yaml: imágenes publicadas por digest, sin
  # reconstruir; humo de software/docker/smoke.sh; el stack se baja con sus volúmenes siempre (D5).
  staging:
    name: Staging simulado (humo por digest)
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      API_IMAGE: ghcr.io/${{ needs.build.outputs.owner_lc }}/dispensart-api@${{ needs.build.outputs.api_digest }}
      WEB_IMAGE: ghcr.io/${{ needs.build.outputs.owner_lc }}/dispensart-web@${{ needs.build.outputs.web_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Contraseña de la base generada por run y enmascarada antes de cualquier uso.
      - name: Contraseña efímera de la base
        run: |
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          echo "DB_PASSWORD=$pw" >> "$GITHUB_ENV"

      # Control del enmascarado: el log debe mostrar *** en lugar del valor.
      - name: Control del enmascarado
        run: echo "DB_PASSWORD=$DB_PASSWORD"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Un digest ausente en GHCR falla aquí, sin construir nada en el runner.
      - name: Descarga de las imágenes publicadas
        run: |
          docker pull "$API_IMAGE"
          docker pull "$WEB_IMAGE"
          docker compose -f software/compose.yaml pull db

      - name: Arranque del stack (sin construir)
        run: docker compose -f software/compose.yaml up --no-build --wait --wait-timeout 180 db api web

      # Stack sano y luego los humos de dominio sobre la base recién sembrada. Usuarios sintéticos con la
      # contraseña SOLO de desarrollo (APP_ENV=local por defecto en compose, sin SEED_USER_PASSWORD): no es secreto.
      - name: Humo del stack y de dominio
        run: bash software/docker/smoke.sh

      - name: Logs del stack
        if: failure()
        run: docker compose -f software/compose.yaml logs --no-color --tail 300

      - name: Bajar el stack
        if: always()
        run: docker compose -f software/compose.yaml down -v

  # Producción simulada: solo main, tras staging, en el entorno production con revisor requerido.
  # La guarda falla cerrada si el entorno no exige revisor o no se puede leer (404/403) (D6).
  production:
    name: Producción (aprobación del entorno production)
    needs: [build, staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      actions: read
    steps:
      - name: Guarda de revisor requerido
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEPLOY_ENV: production
        run: |
          if ! count="$(gh api "repos/$REPO/environments/$DEPLOY_ENV" \
              --jq '[.protection_rules[]? | select(.type=="required_reviewers")] | length')"; then
            echo "::error::No se pudo leer el entorno $DEPLOY_ENV (404/403): no se despliega sin verificar."
            exit 1
          fi
          echo "Reglas de revisor requerido en $DEPLOY_ENV: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::El entorno $DEPLOY_ENV no exige revisor: despliegue bloqueado."
            exit 1
          fi

      # Simulado: publica en el resumen los digests que pasaron staging y el comando que se ejecutaría.
      - name: Despliegue simulado
        env:
          API_REF: ghcr.io/${{ needs.build.outputs.owner_lc }}/dispensart-api@${{ needs.build.outputs.api_digest }}
          WEB_REF: ghcr.io/${{ needs.build.outputs.owner_lc }}/dispensart-web@${{ needs.build.outputs.web_digest }}
        run: |
          {
            echo "## Despliegue a producción (simulado)"
            echo ""
            echo "| Imagen | Referencia |"
            echo "|---|---|"
            echo "| api | \`$API_REF\` |"
            echo "| web | \`$WEB_REF\` |"
            echo ""
            echo "Comando en el servidor:"
            echo ""
            echo "\`\`\`"
            echo "API_IMAGE=$API_REF WEB_IMAGE=$WEB_REF docker compose -f software/compose.yaml pull api web"
            echo "API_IMAGE=$API_REF WEB_IMAGE=$WEB_REF docker compose -f software/compose.yaml up -d --no-build --wait"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "api: $API_REF"
          echo "web: $WEB_REF"
