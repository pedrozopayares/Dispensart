# Reenvío a la API: conserva X-Correlation-Id (petición y respuesta) y el origen público.
proxy_pass http://$api_upstream;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
# Sanctum decide si la petición es de la SPA por Origin/Referer (design D1): se reenvían explícitos.
proxy_set_header Origin $http_origin;
proxy_set_header Referer $http_referer;
# web es el borde del stack: la IP del cliente es la de la conexión, no un X-Forwarded-For que el cliente
# pueda inventar (la API confía en rangos privados y el limitador de login usa esta IP, design D3).
# Revisar si se pone un balanceador delante (S8): entonces $proxy_add_x_forwarded_for.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Correlation-Id $http_x_correlation_id;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
