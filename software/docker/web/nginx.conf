# Nginx de web (imagen unprivileged, uid 101): log de acceso JSON por línea, sin IP ni query string.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Ruta pedida sin query string (puede llevar datos personales): nunca se registra.
    map $request_uri $request_path {
        ~^(?<path_only>[^?]*) $path_only;
    }

    # correlation_id: el que devuelve la API en las rutas reenviadas; vacío en archivos estáticos.
    log_format json escape=json '{"timestamp":"$time_iso8601","level":"info","message":"request",'
        '"service":"web","correlation_id":"$upstream_http_x_correlation_id",'
        '"method":"$request_method","path":"$request_path","status":$status,"duration_s":$request_time}';
    access_log /dev/stdout json;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp_path;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
