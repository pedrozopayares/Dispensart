; Pool único de PHP-FPM para la API, sin root: socket unix compartido con Nginx (mismo usuario app).
[global]
error_log = /proc/self/fd/2
; Las líneas JSON del log de Laravel no se cortan.
log_limit = 8192
log_level = warning
daemonize = no

[app]
listen = /run/app/php-fpm.sock
listen.mode = 0600
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
; Las variables del contenedor (DB_*, APP_KEY) llegan a los workers.
clear_env = no
; stderr de los workers (log JSON de Laravel) sin decorar hacia el stderr del contenedor.
catch_workers_output = yes
decorate_workers_output = no
