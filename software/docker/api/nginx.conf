# Nginx de la API: sirve public/ y pasa a PHP-FPM por socket unix. Corre como usuario app (design D1).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
daemon off;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Laravel ya escribe la línea de cierre JSON por petición con correlation_id; sin log duplicado.
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # Rutas temporales escribibles por un usuario no root.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;
        root /app/public;
        index index.php;
        charset utf-8;

        location / {
            try_files $uri /index.php?$query_string;
        }

        location = /index.php {
            fastcgi_pass unix:/run/app/php-fpm.sock;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_hide_header X-Powered-By;
        }

        # Ningún otro script PHP es ejecutable; archivos ocultos denegados.
        location ~ \.php$ {
            return 404;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
